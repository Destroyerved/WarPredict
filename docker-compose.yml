version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8501:8501"
    command: streamlit run streamlit_app/app.py --server.port=8501
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1